name: BeomLog CI/CD Pipeline

on:
  push:
    branches: [main] # main 브랜치에 코드가 푸시될 때 실행

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Images
        run: |
          # 프론트엔드 빌드 및 푸시 (환경 변수 주입 포함)
          docker build \
            --build-arg NEXT_PUBLIC_BACKEND_URL="${{ secrets.NEXT_PUBLIC_BACKEND_URL }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/beomlog-front:latest ./client
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/beomlog-front:latest

          # 백엔드 빌드 및 푸시
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/beomlog-back:latest ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/beomlog-back:latest

  deploy:
    needs: build-and-push # 빌드가 성공해야 배포를 시작
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/BeomLog
            # 최신 이미지 가져오기
            docker compose -f docker-compose.prod.yml pull
            # 컨테이너 재시작 (변경사항 반영)
            docker compose -f docker-compose.prod.yml up -d
            # 미사용 이미지 삭제 (서버 용량 관리)
            docker image prune -f
