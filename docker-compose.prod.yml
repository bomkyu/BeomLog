services:
  frontend:
    container_name: beomlog-frontend
    image: ${{ secrets.DOCKERHUB_USERNAME }}/beomlog-frontend:latest
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
        - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL}
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL}
      - NEXT_PUBLIC_RESOURCE_URL=${NEXT_PUBLIC_RESOURCE_URL}
    restart: always
    depends_on:
      - backend

  backend:
    container_name: beomlog-backend
    image: ${{ secrets.DOCKERHUB_USERNAME }}/beomlog-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    env_file:
      - .env
    ports:
      - '${BACKEND_PORT}:${BACKEND_PORT}'
    volumes:
      - ./uploads:/app/uploads
    restart: always
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: beomlog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - ./mysql_data:/var/lib/mysql
    restart: always
